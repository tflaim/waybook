[project]
name = "waybook"
version = "0.1.0"
description = "Per-project board for decisions, open threads, and failed attempts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
waybook = "waybook.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["waybook*"]
